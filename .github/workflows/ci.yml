name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known issue: @types/react version drift causes pre-existing typecheck
      # failures unrelated to most PRs. Non-blocking until dependencies are
      # realigned; still runs so regressions are visible in the log.
      - run: pnpm typecheck
        continue-on-error: true
      - run: pnpm exec vite build
