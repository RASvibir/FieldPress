kind = "web"
previewPath = "/fieldpress-desktop/"
title = "FieldPress Desktop Editor"
version = "1.0.0"
id = "artifacts/fieldpress-desktop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/fieldpress-desktop/" ]
localPort = 24671

[services.development]
run = "pnpm --filter @workspace/fieldpress-desktop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fieldpress-desktop", "run", "build" ]
publicDir = "artifacts/fieldpress-desktop/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24671"
BASE_PATH = "/fieldpress-desktop/"
