<!DOCTYPE html>
<html lang="en" class="dark crt-on glow-on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FieldPress" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="FieldPress — pocket newsroom. Capture in the field, produce drafts, open in one tap." />
    <title>FieldPress</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      window.__fpDeferredPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__fpDeferredPrompt = event;
      });
    </script>
    <meta property="og:title" content="FieldPress" />
    <meta property="og:description" content="Pocket newsroom. Open or install in one tap." />
    <meta property="og:image" content="/opengraph.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("fp-theme");
          var dark = true;
          if (stored === "light") dark = false;
          else if (stored === "system") dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("crt-on", localStorage.getItem("fp-crt") !== "0");
          document.documentElement.classList.toggle("glow-on", localStorage.getItem("fp-glow") !== "0");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
